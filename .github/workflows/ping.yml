name: Ping Supabase Anti-Pausa

on:
  schedule:
    # Se ejecuta cada 3 días a la medianoche
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite ejecutar el script manualmente con un botón

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Mantener despierto el Proyecto 1 (jqmgwax...)
        run: |
          curl -s -X GET "https://jqmgwaxqdxdozfuvouzz.supabase.co/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_KEY_1 }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_1 }}"

      - name: Mantener despierto el Proyecto 2 (wmnbgct...)
        run: |
          curl -s -X GET "https://wmnbgctvvrlobaxcqogp.supabase.co/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_KEY_2 }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_2 }}"
